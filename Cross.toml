# cross-rs configuration — cross-compile linux-aarch64 from x86_64 runners.
# The ubuntu-*-arm hosted runners on GitHub Actions have been chronically
# unstable (runner-shutdown signals before the build even starts), so we
# build the aarch64 artifact inside a Docker container on the x86_64 pool
# instead. The image is pinned below (Ubuntu 20.04, glibc 2.31) — older,
# so more compatible, than the pincab's Ubuntu 24.04 (glibc 2.39) and every
# supported SBC target.
#
# pre-build pulls all the SDL3/eframe/winit native deps for aarch64 via
# multiarch apt — sdl3-sys's build-from-source-static needs the X/Wayland
# headers at build time even though the resulting binary statically links
# only SDL3 itself.

[build.env]
passthrough = ["BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu"]

[target.aarch64-unknown-linux-gnu]
# Ubuntu 20.04 based (glibc 2.31, still older than every target): the 0.2.5
# default image ships libclang 3.8, too old for bindgen (FFmpeg bindings).
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update",
    "apt-get install --assume-yes --no-install-recommends cmake pkg-config libxcb-render0-dev:$CROSS_DEB_ARCH libxcb-shape0-dev:$CROSS_DEB_ARCH libxcb-xfixes0-dev:$CROSS_DEB_ARCH libxkbcommon-dev:$CROSS_DEB_ARCH libssl-dev:$CROSS_DEB_ARCH libasound2-dev:$CROSS_DEB_ARCH libpulse-dev:$CROSS_DEB_ARCH libx11-dev:$CROSS_DEB_ARCH libxext-dev:$CROSS_DEB_ARCH libxrandr-dev:$CROSS_DEB_ARCH libxcursor-dev:$CROSS_DEB_ARCH libxi-dev:$CROSS_DEB_ARCH libxtst-dev:$CROSS_DEB_ARCH libxss-dev:$CROSS_DEB_ARCH libwayland-dev:$CROSS_DEB_ARCH wayland-protocols libdbus-1-dev:$CROSS_DEB_ARCH libdrm-dev:$CROSS_DEB_ARCH libgbm-dev:$CROSS_DEB_ARCH libgl1-mesa-dev:$CROSS_DEB_ARCH libgles2-mesa-dev:$CROSS_DEB_ARCH libegl1-mesa-dev:$CROSS_DEB_ARCH libudev-dev:$CROSS_DEB_ARCH nasm libclang-dev clang",
]
